[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nova-osint"
version = "1.1.0"
description = "NOVA - all-in-one OSINT collection: usernames, emails, domains, IPs and phone numbers from public sources."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["osint", "reconnaissance", "threat-intelligence", "security", "footprinting"]
classifiers = [
  "License :: Other/Proprietary License",
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]

# The core engine is standard library only, on purpose: it has to run on a
# locked-down box with no wheels available. Everything below is polish.
dependencies = []

[project.optional-dependencies]
full = ["rich>=13.0", "phonenumbers>=8.13"]
dev = ["rich>=13.0", "phonenumbers>=8.13", "pytest>=7.4", "ruff>=0.4"]

[project.scripts]
nova = "nova_osint.cli:main"
nova-osint = "nova_osint.cli:main"
# gui-scripts launches without a console window on Windows.

[project.gui-scripts]
nova-gui = "nova_osint.gui.app:main"

[project.urls]
Homepage = "https://github.com/UnoRfl/nova-osint"
Issues = "https://github.com/UnoRfl/nova-osint/issues"

[tool.hatch.build.targets.wheel]
packages = ["nova_osint"]

[tool.hatch.build.targets.sdist]
include = ["nova_osint", "tests", "README.md", "ARCHITECTURE.md", "LICENSE", "ETHICS.md"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008", "SIM105"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["network: hits the live internet; deselect with -m 'not network'"]
