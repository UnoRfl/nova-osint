name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege at the top; jobs escalate only what they need.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      # Third-party actions are pinned to a commit SHA, never a tag: a tag is a
      # mutable pointer its owner can move. The version stays in the comment so
      # Dependabot can still offer upgrades.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      # The suite is deliberately offline, so CI never depends on a third
      # party's rate limit being in a good mood.
      - name: Test
        run: pytest -q -m "not network"

      - name: Import check without optional dependencies
        run: |
          pip uninstall -y rich phonenumbers
          python -c "import nova_osint; from nova_osint.cli import main; main(['modules'])"
          python -c "from nova_osint.core import art; assert art.still(0.5)"

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          languages: python
          queries: security-extended
      - uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks needs the full history, not just the tip
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Belt and braces: match key *shapes*, not the words. A check that trips
      # over a comment saying "never commit a token here" is one people learn
      # to ignore.
      - name: Key-shape guard
        run: |
          set -euo pipefail
          if grep -rInE \
            -e 'eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}' \
            -e 'gh[pousr]_[A-Za-z0-9]{36,}' \
            -e 'sk-[A-Za-z0-9]{32,}' \
            -e 'AKIA[0-9A-Z]{16}' \
            -e 'xox[baprs]-[A-Za-z0-9-]{10,}' \
            --exclude-dir=.git --exclude-dir=.github . ; then
            echo "::error::something shaped like a credential is committed"
            exit 1
          fi
          echo "no credential-shaped strings found"

  workflows:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # zizmor audits these workflows themselves: template injection through
      # ${{ }}, over-broad permissions, unpinned actions, credential persistence.
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
