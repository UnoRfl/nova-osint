version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    # A freshly published release is exactly when a compromised version is live
    # and unreported. Wait a week before offering it.
    cooldown:
      default-days: 7
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
